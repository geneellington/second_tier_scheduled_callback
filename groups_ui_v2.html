<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheduler – Groups (v2)</title>

  <!-- ===== Minimal styles (kept small; safe with the rest of your site) ===== -->
  <style>
    :root { --line:#e6e8ef; --ink:#1a1d2a; --muted:#6a7280; --brand:#0d6efd; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; color:var(--ink); }
    .wrap { max-width: 1100px; margin: 16px auto; padding: 0 12px 40px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:10px; }
    .toolbar label { font-size:14px; color:var(--muted); }
    .toolbar select, .toolbar input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
    .h { margin: 14px 2px 8px; font-weight:700; }
    .hour { margin: 8px 0 14px; }
    .hour h4 { margin: 0 0 6px; font: 600 14px system-ui,sans-serif; color:#333; }
    .grid { display:grid; grid-template-columns: repeat(6, minmax(120px,1fr)); gap:6px; }
    .slot { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .slot[disabled] { background:#f7f7f7; color:#888; cursor:not-allowed; }
    .btn { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#f2f4ff; cursor:pointer; }
    .btn.brand { background:var(--brand); color:#fff; border:none; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid var(--line); text-align:left; padding:8px; font-size:14px; }
    thead tr { background:#f6f7ff; }
    .muted { color:var(--muted); }
  </style>

  <!-- ===== API client (uses your existing prod stage) ===== -->
  <script>
    (function () {
      const BASE = "https://f36ru2h4ua.execute-api.us-east-1.amazonaws.com/prod";
      async function fetchJSON(url, options = {}) {
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        const res = await fetch(url, { ...options, headers });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch {}
        if (!res.ok) throw new Error(data?.error || data?.message || res.statusText);
        return data;
      }
      function qs(params) {
        const p = new URLSearchParams();
        Object.entries(params).forEach(([k, v]) => (v != null && v !== "") && p.append(k, v));
        return p.toString();
      }
      window.Api = {
        listEntries: (date)              => fetchJSON(`${BASE}/entries?${qs({ date })}`),
        createEntry: (entry)              => fetchJSON(`${BASE}/entries`, { method: "POST", body: JSON.stringify(entry) }),
        updateEntry: (id, patch)          => fetchJSON(`${BASE}/entries/${id}`, { method: "PATCH", body: JSON.stringify(patch) }),
        deleteEntry: (id, date, time)     => fetchJSON(`${BASE}/entries/${id}?${qs({ date, time })}`, { method: "DELETE" }),
      };
    })();
  </script>

  <!-- ===== Time zone helpers (sticky) ===== -->
  <script>
    const TZ_KEY = "ui.timezone";
    const DEFAULT_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const TZ_LIST = ["UTC","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","Europe/London","Europe/Berlin","Asia/Tokyo","Australia/Sydney"];

    function getSelectedTZ(){ return localStorage.getItem(TZ_KEY) || DEFAULT_TZ; }
    function setSelectedTZ(tz){ localStorage.setItem(TZ_KEY, tz); }
    function initTZDropdown(selectEl){
      selectEl.innerHTML = "";
      const chosen = getSelectedTZ();
      TZ_LIST.forEach(tz => {
        const opt = document.createElement("option");
        opt.value = tz; opt.textContent = tz; if (tz === chosen) opt.selected = true;
        selectEl.appendChild(opt);
      });
      selectEl.addEventListener("change", () => setSelectedTZ(selectEl.value));
    }

    // Display a UTC ISO instant as wall time in the selected TZ
    function formatUTCAsLocal(utcISOString, opts = {}) {
      return new Intl.DateTimeFormat(undefined, { timeZone: getSelectedTZ(), hour:"2-digit", minute:"2-digit", ...opts })
        .format(new Date(utcISOString));
    }

    // Convert local wall time (date "YYYY-MM-DD", time "HH:MM") in selected TZ → UTC ISO
    function toUTCISOFromSelectedTZ(dateYYYYMMDD, hhmm) {
      const tz = getSelectedTZ();
      const localWall = new Date(`${dateYYYYMMDD}T${hhmm}:00`); // build a Date representing the wall time
      const inv = new Date(localWall.toLocaleString('en-US', { timeZone: tz })); // same wall time interpreted in TZ
      const diff = localWall.getTime() - inv.getTime();
      const utcInstant = new Date(localWall.getTime() + diff);
      return utcInstant.toISOString();
    }
  </script>
</head>

<body>
  <div class="wrap">
    <!-- ===== Toolbar: Day, Group, Time Zone ===== -->
    <div class="toolbar">
      <label>Day:
        <input id="day" type="date" />
      </label>

      <label>Group:
        <select id="group"></select>
      </label>

      <label>Time zone:
        <select id="tzSelect"></select>
      </label>

      <button id="refresh" class="btn">Refresh</button>
    </div>

    <!-- ===== Hourly grid (per selected group) ===== -->
    <h2 class="h">Availability</h2>
    <div id="gridHost"></div>

    <!-- ===== Create form ===== -->
    <h2 class="h">Create entry</h2>
    <form id="createForm" class="toolbar" novalidate>
      <label>Time
        <input name="time" type="time" step="600" required />
      </label>
      <label>Duration (min)
        <input name="durationMin" type="number" min="10" step="10" value="10" required />
      </label>
      <label>Agent ID
        <input name="agentId" placeholder="Agent ID" required />
      </label>
      <label>Customer
        <input name="customer" placeholder="Customer" />
      </label>
      <label>Notes
        <input name="notes" placeholder="Notes" />
      </label>
      <button id="createBtn" type="submit" class="btn brand">Create</button>
    </form>

    <!-- ===== Entries table (for selected day) ===== -->
    <h2 class="h">Entries for selected day</h2>
    <div class="muted" id="status">Ready.</div>
    <div style="overflow:auto;border:1px solid var(--line);border-radius:10px;">
      <table id="entriesTable">
        <thead>
          <tr><th>Time</th><th>Duration</th><th>Agent</th><th>Customer</th><th>Notes</th><th>Actions</th></tr>
        </thead>
        <tbody id="entriesTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== App script (groups + grid + API wiring) ===== -->
  <script>
    // ---------- simple utilities ----------
    const pad = n => n.toString().padStart(2,'0');
    function times10min(){ const out=[]; for(let h=0; h<24; h++) for(let m=0; m<60; m+=10) out.push(`${pad(h)}:${pad(m)}`); return out; }
    function setStatus(msg){ document.getElementById('status').textContent = msg; }

    // ---------- state ----------
    let cfg = null;                 // parsed capacity.json
    let activeGroupKey = null;      // current group (sticky)
    const LS_GROUP = 'sc_group_key';

    // ---------- load capacity.json and populate group dropdown ----------
    async function loadCapacityJSON() {
      const r = await fetch('capacity.json', { cache:'no-store' });
      if (!r.ok) throw new Error('Failed to load capacity.json');
      cfg = await r.json();
      const sel = document.getElementById('group');
      sel.innerHTML = '';
      Object.entries(cfg.groups).forEach(([key, g]) => {
        const opt = document.createElement('option');
        opt.value = key; opt.textContent = g.displayName || key;
        sel.appendChild(opt);
      });
      const saved = localStorage.getItem(LS_GROUP);
      if (saved && cfg.groups[saved]) { sel.value = saved; activeGroupKey = saved; }
      else { activeGroupKey = sel.value; }
      sel.addEventListener('change', () => {
        activeGroupKey = sel.value;
        localStorage.setItem(LS_GROUP, activeGroupKey);
        renderGrid();
      });
    }

    // ---------- render 24 hour sections with 6 buttons each ----------
    function renderGrid() {
      const host = document.getElementById('gridHost');
      host.innerHTML = '';
      if (!cfg || !activeGroupKey) return;

      const slots = cfg.groups[activeGroupKey]?.slots || {}; // "HH:MM" -> capacity
      for (let h=0; h<24; h++) {
        const hh = pad(h);
        const sec = document.createElement('section'); sec.className = 'hour';
        const h4 = document.createElement('h4'); h4.textContent = `${hh}:00 – ${hh}:59`; sec.appendChild(h4);
        const grid = document.createElement('div'); grid.className = 'grid';

        for (let m=0; m<60; m+=10) {
          const mm = pad(m);
          const t = `${hh}:${mm}`;
          const cap = Number(slots[t] || 0);
          const btn = document.createElement('button');
          btn.className = 'slot';
          btn.textContent = cap > 0 ? `${t}  (open ${cap})` : `${t}  (closed)`;
          btn.disabled = cap <= 0;
          if (cap > 0) {
            btn.addEventListener('click', () => {
              // Prefill the Create form's time input
              const timeInput = document.querySelector('#createForm input[name="time"]');
              if (timeInput) timeInput.value = t;
              setStatus(`Selected ${t} in group “${cfg.groups[activeGroupKey].displayName}”`);
            });
          }
          grid.appendChild(btn);
        }
        sec.appendChild(grid);
        host.appendChild(sec);
      }
    }

    // ---------- entries table ----------
    function rowHTML(e) {
      // Prefer scheduledAt if present; else assume (date,time) are UTC and format to local TZ
      const iso = e.scheduledAt ? e.scheduledAt : (e.date && e.time ? `${e.date}T${e.time}:00Z` : null);
      const viewTime = iso ? formatUTCAsLocal(iso, { hour: "2-digit", minute: "2-digit" }) : (e.time || "");
      return `
        <tr data-id="${e.id}" data-time="${e.time}">
          <td>${viewTime}</td>
          <td>${e.durationMin}</td>
          <td>${e.agentId || ""}</td>
          <td>${e.customer || ""}</td>
          <td>${e.notes || ""}</td>
          <td><button class="btn" data-act="del">Delete</button></td>
        </tr>`;
    }

    async function loadEntriesForDay() {
      const date = document.getElementById('day').value;
      const tbody = document.getElementById('entriesTbody');
      tbody.innerHTML = `<tr><td colspan="6" class="muted">Loading…</td></tr>`;
      try {
        const items = await Api.listEntries(date);
        items.sort((a,b)=> (a.time||'').localeCompare(b.time||''));
        tbody.innerHTML = items.length ? items.map(rowHTML).join('') : `<tr><td colspan="6" class="muted">No entries.</td></tr>`;
        // Wire delete buttons
        tbody.querySelectorAll('button[data-act="del"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const tr = btn.closest('tr'); const id = tr.dataset.id; const time = tr.dataset.time;
            if (!confirm('Delete this entry?')) return;
            try { await Api.deleteEntry(id, document.getElementById('day').value, time); tr.remove(); }
            catch(e){ alert('Delete failed: ' + e.message); }
          });
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#b00;">Error: ${e.message}</td></tr>`;
      }
    }

    // ---------- create form (local → UTC) ----------
    (function wireCreate(){
      const form = document.getElementById('createForm');
      const btn  = document.getElementById('createBtn');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const fd = new FormData(form);
          const date = document.getElementById('day').value;
          const time = fd.get('time');                       // HH:MM (local wall time)
          const iso  = toUTCISOFromSelectedTZ(date, time);   // UTC ISO

          const d = new Date(iso);
          const utcDate = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
          const utcTime = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;

          // NOTE: server should derive queue from groupKey using capacity.json (do NOT trust client ARNs)
          const payload = {
            date: utcDate,
            time: utcTime,
            durationMin: Number(fd.get('durationMin') || 10),
            agentId: fd.get('agentId') || "",
            customer: fd.get('customer') || "",
            notes: fd.get('notes') || "",
            scheduledAt: iso,
            groupKey: activeGroupKey
          };

          await Api.createEntry(payload);
          form.reset(); document.getElementById('day').value = date; // keep date
          await loadEntriesForDay();
          setStatus(`Created ${time} (${utcTime} UTC) in group “${cfg.groups[activeGroupKey].displayName}”.`);
        } catch (err) {
          alert('Create failed: ' + (err?.message || err));
        } finally {
          btn.disabled = false; btn.textContent = 'Create';
        }
      });
    })();

    // ---------- init ----------
    (async function init(){
      // Day picker defaults to today (YYYY-MM-DD)
      const today = new Date(); const yyyy = today.getFullYear(); const mm = pad(today.getMonth()+1); const dd = pad(today.getDate());
      const dayEl = document.getElementById('day'); dayEl.value = `${yyyy}-${mm}-${dd}`;

      // Time zone dropdown
      initTZDropdown(document.getElementById('tzSelect'));

      // capacity + groups
      await loadCapacityJSON();
      renderGrid();

      // entries table
      await loadEntriesForDay();

      // refresh handlers
      document.getElementById('refresh').addEventListener('click', loadEntriesForDay);
      dayEl.addEventListener('change', loadEntriesForDay);
      document.getElementById('tzSelect').addEventListener('change', loadEntriesForDay); // relabel times when TZ changes
      document.getElementById('group').addEventListener('change', () => setStatus(`Group set to “${cfg.groups[activeGroupKey].displayName}”`));
    })();
  </script>
</body>
</html>
