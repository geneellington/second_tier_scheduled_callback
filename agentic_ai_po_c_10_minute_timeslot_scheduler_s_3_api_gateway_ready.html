  <style>
    :root {
      --bg: #f7f7f9;

      --brand: #0d6efd;

      --full: #d93025;
      --slot-h: 32px;
    }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .app { max-width: 1180px; margin: 0 auto; padding: 18px; display: grid; gap: 12px; }

    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; align-items: center; }
    .title { font-weight: 700; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .controls input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 260px; }
    .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #f2f4ff; color: var(--ink); cursor: pointer; }

    .day-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .day-tab { background: var(--card); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .day-tab.active { color: var(--ink); border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }

    .calendar { background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 90px 1fr; overflow: hidden; height: 620px; }
    .time-labels { border-right: 1px solid var(--line); overflow-y: auto; background: #fafbff; }
    .slots { overflow-y: auto; }

    .hour-label { height: calc(var(--slot-h) * 6); display: grid; align-items: start; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

    .slot { height: var(--slot-h); display: grid; align-items: center; border-bottom: 1px solid var(--line); grid-template-columns: 90px 110px 1fr; gap: 8px; padding: 0 8px; }
    .slot:hover { background: #f7faff; }
    .slot-time { font-size: 12px; color: var(--ink); }
    .slot-cap { font-size: 12px; padding: 2px 8px; border-radius: 999px; width: max-content; }
    .cap-ok { background: rgba(24,165,88,0.12); color: var(--ok); border: 1px solid rgba(24,165,88,0.35); }
    .cap-warn { background: rgba(230,184,0,0.12); color: #a87b00; border: 1px solid rgba(230,184,0,0.35); }
    .cap-full { background: rgba(217,48,37,0.12); color: var(--full); border: 1px solid rgba(217,48,37,0,0.35); }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip { font-size: 11px; background: #f2f4ff; border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
    .chip .x { margin-left: 6px; color: var(--full); cursor: pointer; font-weight: 700; }

    .status { font-size: 12px; color: var(--muted); padding: 4px 2px 0; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    thead tr { background: #f6f7ff; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal { width: 520px; max-width: 92vw; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .modal h3 { margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    .form { display: grid; gap: 10px; }
    .form label { font-size: 12px; color: var(--muted); }
    .form input, .form textarea { padding: 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
    .form textarea { min-height: 80px; resize: vertical; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>

  <!-- API client -->
  <script>
  (function () {
    const BASE = "https://f36ru2h4ua.execute-api.us-east-1.amazonaws.com/prod";
    async function fetchJSON(url, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const res = await fetch(url, { ...options, headers });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok) throw new Error(data?.error || data?.message || res.statusText);
      return data;
    }
    function qs(params) {
      const p = new URLSearchParams();
      Object.entries(params).forEach(([k, v]) => (v != null && v !== "") && p.append(k, v));
      return p.toString();
    }
    window.Api = {
      listEntries: (date, from, to) => fetchJSON(`${BASE}/entries?${qs({ date, from, to })}`),
      createEntry: (entry)          => fetchJSON(`${BASE}/entries`, { method: "POST", body: JSON.stringify(entry) }),
      replaceEntry: (id, entry)     => fetchJSON(`${BASE}/entries/${id}`, { method: "PUT", body: JSON.stringify(entry) }),
      updateEntry: (id, patch)      => fetchJSON(`${BASE}/entries/${id}`, { method: "PATCH", body: JSON.stringify(patch) }),
      deleteEntry: (id, date, time) => fetchJSON(`${BASE}/entries/${id}?${qs({ date, time })}`, { method: "DELETE" }),
    };
  })();
  </script>

  <script>
  // Time zone dropdown + helpers
  const DEFAULT_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  const TZ_KEY = "ui.timezone";
  const TZ_LIST = ["UTC","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","Europe/London","Europe/Berlin","Asia/Tokyo","Australia/Sydney"];

  function getSelectedTZ() { return localStorage.getItem(TZ_KEY) || DEFAULT_TZ; }
  function setSelectedTZ(tz) { localStorage.setItem(TZ_KEY, tz); }
  function initTZDropdown() {
    const sel = document.getElementById("tzSelect");
    sel.innerHTML = "";
    const chosen = getSelectedTZ();
    TZ_LIST.forEach(tz => {
      const opt = document.createElement("option");
      opt.value = tz; opt.textContent = tz;
      if (tz === chosen) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", () => {
      setSelectedTZ(sel.value);
      renderTabs();     // so “(Today)” recalculates against selected TZ if you add that later
      renderSlots();    // relabel slots to new TZ
      renderEntriesTable(); // relabel API table times
    });
  }
  function formatUTCAsLocal(utcISOString, opts = {}) {
    const tz = getSelectedTZ();
    return new Intl.DateTimeFormat(undefined, { timeZone: tz, hour:"2-digit", minute:"2-digit", ...opts })
      .format(new Date(utcISOString));
  }
  function localToUTCISO(dateYYYYMMDD, hhmm) {
    const tz = getSelectedTZ();
    const localInstant = new Date(`${dateYYYYMMDD}T${hhmm}:00`);
    const utcLike = new Date(localInstant.toLocaleString("en-US", { timeZone: tz }));
    return new Date(
      new Intl.DateTimeFormat("en-CA", {
        timeZone:"UTC", year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).format(utcLike).replace(",","")
    ).toISOString();
  }
  document.addEventListener("DOMContentLoaded", initTZDropdown);
  </script>

    <div id="slots" style="display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px;margin-top:12px;"></div>

    <!-- optional UTC readout if you already have #date and #time inputs -->

    <!-- Hourly slots container -->

  <script>
    // ================= Utilities =================
    const pad = n => n.toString().padStart(2, '0');
    const today = new Date(); today.setHours(0,0,0,0);
    const toISO = d => d.toISOString().slice(0,10);
    const human = d => d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    function timeStrings(){ const out=[]; for(let h=0; h<24; h++) for(let m=0; m<60; m+=10) out.push(`${pad(h)}:${pad(m)}`); return out; }

    // ================= Local DataStore =================
    const DataStore = {
      key: 'poc_events_v1',
      async list(){ return JSON.parse(localStorage.getItem(this.key) || '[]'); },
      async save(evt){ const all = await this.list(); all.push(evt); localStorage.setItem(this.key, JSON.stringify(all)); return evt; },
      async remove(id){ const all = await this.list(); localStorage.setItem(this.key, JSON.stringify(all.filter(e=>e.id!==id))); },
    };

    // ================= Capacity =================
    let capacityMap = {};
    let defaultCapacity = 1;

    async function loadCapacity(path){
      const res = await fetch(path, { cache:'no-store' });
      if(!res.ok) throw new Error(`Failed to fetch capacity: ${res.status}`);
      capacityMap = await res.json();
      setStatus(`Loaded capacity from ${path}`);
      renderSlots();
      renderEntriesTable();
    }
    function buildExampleCapacity(){
      const ex = {};
      for(let i=0;i<5;i++){
        const d = new Date(today); d.setDate(today.getDate()+i);
        const iso = toISO(d);
        ex[iso] = {};
        timeStrings().forEach(ts=>{
          const [hh] = ts.split(':').map(Number);
          let cap = 0;
          if(hh>=9 && hh<12) cap = 2;
          else if(hh>=12 && hh<14) cap = 1;
          else if(hh>=14 && hh<17) cap = 3;
          else if(hh>=17 && hh<19) cap = 2;
          else cap = 0;
          ex[iso][ts] = cap;
        });
      }
      return ex;
    }
    function capacityFor(dateISO, time){
      const day = capacityMap[dateISO] || {};
      const v = day[time];
      return typeof v === 'number' ? v : defaultCapacity;
    }

    // ================= State & Elements =================
    const DAYS = 5;
    let activeDateISO = toISO(today);
    let allEvents = [];

    const dayTabs = document.getElementById('dayTabs');
    const timeLabels = document.getElementById('timeLabels');
    const slotsEl = document.getElementById('slots');
    const statusEl = document.getElementById('status');
    const entriesTbody = document.getElementById('entriesTbody');

    const capacityPath = document.getElementById('capacityPath');
    const loadBtn = document.getElementById('loadBtn');
    const exportBtn = document.getElementById('exportBtn');

    const backdrop = document.getElementById('backdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const form = document.getElementById('eventForm');
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const commentsInput = document.getElementById('comments');
    const cancelBtn = document.getElementById('cancelBtn');

    slotsEl.addEventListener('scroll', () => { timeLabels.scrollTop = slotsEl.scrollTop; });
    function setStatus(msg){ statusEl.textContent = msg; }

    // ================= Tabs =================
    function renderTabs(){
      dayTabs.innerHTML = '';
      for(let i=0;i<DAYS;i++){
        const d = new Date(today); d.setDate(today.getDate()+i);
        const iso = toISO(d);
        const tab = document.createElement('button');
        tab.className = 'day-tab' + (iso===activeDateISO ? ' active' : '');
        tab.textContent = human(d) + (i===0 ? ' (Today)' : '');
        tab.onclick = async () => {
          activeDateISO = iso;
          renderTabs();
          await refreshCalendarFromAPI();   // <<< NEW: get API entries for the selected day
          renderSlots(true);
          renderEntriesTable();
        };
        dayTabs.appendChild(tab);
      }
    }

    // ================= Hour labels (localized display) =================
    function renderHourLabels(){
      timeLabels.innerHTML = '';
      for(let h=0; h<24; h++){
        const utcISO = `${activeDateISO}T${pad(h)}:00:00Z`;     // treat as UTC anchor
        const label  = formatUTCAsLocal(utcISO, { hour:"2-digit" }); // show as local hour
        const lab = document.createElement('div');
        lab.className = 'hour-label';
        lab.textContent = `${label}:00`;
        timeLabels.appendChild(lab);
      }
    }

    // ================= Slots =================
    function eventsFor(dateISO, time){ return allEvents.filter(e => e.date===dateISO && e.time===time); }
    function capClass(used, cap){ if(cap === 0 || used >= cap) return 'cap-full'; if(used >= cap - 1) return 'cap-warn'; return 'cap-ok'; }

    function renderSlots(scrollToNow=false){
      renderHourLabels();
      slotsEl.innerHTML = '';
      const times = timeStrings();

      times.forEach(ts => {
        const used = eventsFor(activeDateISO, ts).length;
        const cap = capacityFor(activeDateISO, ts);

        const row = document.createElement('div');
        row.className = 'slot';
        row.dataset.time = ts;

        const tcol = document.createElement('div');
        tcol.className = 'slot-time';
        // DISPLAY ONLY: localized label from UTC instant for this date+time
        const display = formatUTCAsLocal(`${activeDateISO}T${ts}:00Z`, { hour:"2-digit", minute:"2-digit" });
        tcol.textContent = display;

        const capCol = document.createElement('div');
        capCol.className = `slot-cap ${capClass(used, cap)}`;
        capCol.textContent = `${used}/${cap}`;

        const chips = document.createElement('div');
        chips.className = 'chips';

        eventsFor(activeDateISO, ts).forEach(evt => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `${escapeHtml(evt.name)} · ${escapeHtml(evt.phone)} <span class="x" title="Remove">×</span>`;
          chip.querySelector('.x').onclick = async (e) => {
            e.stopPropagation();
            if(confirm(`Remove entry for ${evt.name} @ ${activeDateISO} ${ts}?`)){
              await DataStore.remove(evt.id);
              allEvents = await DataStore.list();
              renderSlots();
              renderEntriesTable();
              setStatus('Entry removed.');
            }
          };
          chips.appendChild(chip);
        });

        row.ondblclick = () => {
          if(cap <= 0 || used >= cap){
            alert('This timeslot is full or capacity is 0 for this time.');
            return;
          }
          openModal(activeDateISO, ts, used, cap);
        };

        row.appendChild(tcol);
        row.appendChild(capCol);
        row.appendChild(chips);
        slotsEl.appendChild(row);
      });

      if(scrollToNow){
        const now = new Date();
        if(toISO(now) === activeDateISO){
          const idx = now.getHours()*6 + Math.floor(now.getMinutes()/10);
          const el = slotsEl.children[idx];
          if(el) slotsEl.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
        }
      }
    }

    // ================= Modal & Form =================
    let ctx = null;
    function openModal(dateISO, time, used, cap){
      ctx = { dateISO, time };
      document.getElementById('modalTitle').textContent = `Add Entry for ${dateISO} ${time}`;
      document.getElementById('modalSub').textContent = `Capacity: ${used}/${cap}`;
      nameInput.value = ''; phoneInput.value = ''; commentsInput.value = '';
      backdrop.style.display = 'flex'; backdrop.setAttribute('aria-hidden','false'); nameInput.focus();
    }
    function closeModal(){ backdrop.style.display = 'none'; backdrop.setAttribute('aria-hidden','true'); ctx = null; }
    cancelBtn.onclick = closeModal;
    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeModal(); });

    form.addEventListener('submit', async (e)=>{
      e.preventDefault(); if(!ctx) return;
      const { dateISO, time } = ctx;
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const comments = commentsInput.value.trim();
      if(!name || !phone){ alert('Name and phone are required.'); return; }

      const used = eventsFor(dateISO, time).length;
      const cap = capacityFor(dateISO, time);
      if(used >= cap){ alert('This timeslot is now full.'); closeModal(); return; }

      const evt = { id: Math.random().toString(36).slice(2), date: dateISO, time, name, phone, comments, createdAt: new Date().toISOString() };
      await DataStore.save(evt);
      allEvents = await DataStore.list();
      renderSlots(); renderEntriesTable(); closeModal();
      setStatus(`Saved entry for ${name} @ ${dateISO} ${time}`);
    });

    // ================= “Entries for Selected Day” (local store) =================
    function renderEntriesTable(){
      const tz = getSelectedTZ();
      const rows = allEvents
        .filter(e => e.date === activeDateISO)
        .sort((a,b)=> a.time.localeCompare(b.time))
        .map(e => {
          // Show localized label but keep e.time in data attributes for actions
          const iso = `${e.date}T${e.time}:00Z`;
          const viewTime = formatUTCAsLocal(iso, { hour:"2-digit", minute:"2-digit" });
          return `<tr>
            <td>${viewTime}</td>
            <td>${escapeHtml(e.name)}</td>
            <td>${escapeHtml(e.phone)}</td>
            <td>${escapeHtml(e.comments || '')}</td>
            <td><button data-id="${e.id}" class="btn">Delete</button></td>
          </tr>`;
        });
      entriesTbody.innerHTML = rows.join('') || `<tr><td colspan="5" style="color:var(--muted);">No entries for this day.</td></tr>`;

      entriesTbody.querySelectorAll('button[data-id]').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-id');
          await DataStore.remove(id);
          allEvents = await DataStore.list();
          renderSlots(); renderEntriesTable(); setStatus('Entry removed.');
        };
      });
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

   
    // --- Bridge: map API items -> calendar "allEvents" shape (used by renderSlots)
    function apiItemToCalendarEvent(e) {
      return {
        id: e.id,
        date: e.date,                 // day string, e.g., "2025-10-09"
        time: e.time,                 // already local (TZ shim rewrites listEntries)
        name: e.customer || "",       // show customer name on the chip
        phone: e.phone || "",
        comments: e.notes || "",
        createdAt: e.createdAt || ""
      };
    }

    // Fetch entries for the active day from API and refresh global allEvents
    async function refreshCalendarFromAPI() {
      try {
        const items = await Api.listEntries(activeDateISO); // TZ shim returns local times
        allEvents = (Array.isArray(items) ? items : []).map(apiItemToCalendarEvent);
      } catch (err) {
        console.error("[Calendar] Failed to load from API", err);
        allEvents = [];
      }
    }


    // ================= Controls =================
    loadBtn.onclick = async () => {
      try {
        const path = capacityPath.value.trim();
        if(!path) { alert('Enter a capacity.json path or URL.'); return; }
        await loadCapacity(path);
      } catch(err){ alert(err.message); }
    };
    exportBtn.onclick = async () => {
      const data = await DataStore.list();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'events_export.json'; a.click();
      URL.revokeObjectURL(url);
      setStatus('Exported events as JSON.');
    };

    // ================= Init =================
    (async function init(){
//      allEvents = await DataStore.list();
      capacityMap = buildExampleCapacity();
      renderTabs();
      await refreshCalendarFromAPI();
      renderSlots(true);
      renderEntriesTable();
      setStatus('Using example capacity. Load your capacity.json to override.');
    })();
  </script>

  <!-- Create form -->
  <form id="createForm" class="toolbar" novalidate>
    <input name="time" type="time" step="600" required />
    <input name="durationMin" type="number" min="10" step="10" value="10" required />
    <input name="agentId" placeholder="Agent ID" required />
    <input name="customer" placeholder="Customer" />
    <input name="notes" placeholder="Notes" style="min-width:220px" />
    <button id="createBtn" type="submit">Create</button>
  </form>

  <script>
    // === Single submit handler (no double-submit) + TZ→UTC conversion ===
    (function () {
      if (window.__createWired) return;
      window.__createWired = true;

      const form  = document.getElementById("createForm");
      const btn   = document.getElementById("createBtn");
      const dayEl = document.getElementById("day");

      if (!form || !dayEl) { console.warn("[Create] form/day not found"); return; }

      function ensure10m(hhmm) {
        const m = String(hhmm || "").match(/^(\d{2}):(\d{2})$/);
        return m && Number(m[2]) % 10 === 0;
      }

      // turn local date+time in selected TZ into a UTC ISO string
      function toUTCISOFromSelectedTZ(dateYYYYMMDD, hhmm) {
        const tz = (typeof getSelectedTZ === "function") ? getSelectedTZ() : "UTC";
        const localWall = new Date(`${dateYYYYMMDD}T${hhmm}:00`);

        // Convert a system-local Date that represents the desired WALL TIME
        // into the actual UTC instant for that wall time in the selected TZ.
        // (MDN “zonedTimeToUtc” pattern)
        const inv = new Date(localWall.toLocaleString('en-US', { timeZone: tz }));
        const diff = localWall.getTime() - inv.getTime();
        const utcInstant = new Date(localWall.getTime() + diff);

        return utcInstant.toISOString(); // e.g., "2025-10-09T23:50:00.000Z"
      }



      async function doCreate(e) {
        e.preventDefault();
        if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }

        try {
          const fd     = new FormData(form);
          const localD = dayEl.value;                // YYYY-MM-DD (selected in the Day picker)
          const localT = fd.get("time");             // HH:mm from the form (10-min step)
          const dur    = Number(fd.get("durationMin") || 10);
          const agent  = fd.get("agentId");
          const cust   = fd.get("customer") || "";
          const notes  = fd.get("notes") || "";

          if (!ensure10m(localT)) {
            alert("Time must be 10-minute aligned (e.g., 14:30, 14:40).");
            return;
          }

          // Convert local (in selected TZ) → UTC
          const iso = toUTCISOFromSelectedTZ(localD, localT); // e.g., "2025-10-09T20:40:00Z"
          const d   = new Date(iso);                          // UTC instant
          const utcDate = [
            d.getUTCFullYear(),
            String(d.getUTCMonth()+1).padStart(2,"0"),
            String(d.getUTCDate()).padStart(2,"0")
          ].join("-");
          const utcTime = [
            String(d.getUTCHours()).padStart(2,"0"),
            String(d.getUTCMinutes()).padStart(2,"0")
          ].join(":");

          const payload = {
            // send UTC values to backend
            date: utcDate,
            time: utcTime,
            durationMin: dur,
            agentId: agent,
            customer: cust,
            notes,
            // include scheduledAt for clarity (backend can ignore or use)
            scheduledAt: iso
          };

          console.log("[Create] tz→utc", {
            selectedTZ: (typeof getSelectedTZ === "function") ? getSelectedTZ() : "(unknown)",
            localDate: localD, localTime: localT, scheduledAtUTC: iso,
            sending: { date: utcDate, time: utcTime }
          });

          console.log("[Create] send payload", payload);

          const created = await Api.createEntry(payload);
          console.log("[Create] API OK →", created);

          // Keep selected day after reset
          form.reset();
          dayEl.value = localD;

          // Refresh UI (calendar + table)
          if (typeof refreshCalendarFromAPI === "function") await refreshCalendarFromAPI();
          if (typeof loadDay === "function") await loadDay();

          // Optional: status line; comment this out if you dislike popups
          alert("Created entry at " + localT + " (" + utcTime + " UTC)");
        } catch (err) {
          console.error("[Create] failed:", err);
          alert("Create failed: " + (err?.message || err));
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = "Create"; }
        }
      }

      // Ensure we only wire one handler
      form.addEventListener("submit", doCreate);
      console.log("[Create] handler attached (tz→utc)");
    })();
  </script>

  <script>
  (function () {
    const dayEl = document.getElementById("day");
    const refreshBtn = document.getElementById("refresh");
    const tbody = document.querySelector("#entriesTable tbody");
    const createForm = document.getElementById("createForm");
    const editModal = document.getElementById("editModal");
    const editForm = document.getElementById("editForm");
    const editCancel = document.getElementById("editCancel");

    const today = new Date().toISOString().slice(0,10);
    dayEl.value = dayEl.value || today;

    const showModal = () => { editModal.style.display = "grid"; };
    const hideModal = () => { editModal.style.display = "none"; };

    function ensure10m(hhmm) {
      const m = String(hhmm || "").match(/^(\d{2}):(\d{2})$/);
      if (!m) return false;
      return Number(m[2]) % 10 === 0;
    }

    async function loadDay() {
      const date = dayEl.value;
      tbody.innerHTML = `<tr><td colspan="6">Loading…</td></tr>`;
      try {
        const items = await Api.listEntries(date);
        items.sort((a,b) => a.time.localeCompare(b.time));
        if (!items.length) {
          tbody.innerHTML = `<tr><td colspan="6">No entries.</td></tr>`;
          return;
        }
        tbody.innerHTML = items.map(rowHTML).join("");
        attachRowHandlers();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#b00">Error: ${e.message}</td></tr>`;
      }
    }

    // rowHTML: display localized time but keep original e.time in data attributes and buttons
    function rowHTML(e) {
      const iso = e.scheduledAt ? e.scheduledAt : (e.date && e.time ? `${e.date}T${e.time}:00Z` : null);
      const viewTime = iso ? formatUTCAsLocal(iso, { hour: "2-digit", minute: "2-digit" }) : (e.time || "");
      return `
        <tr class="entry-row" data-id="${e.id}" data-time="${e.time}"
            data-duration="${e.durationMin}" data-customer="${e.customer||""}"
            data-notes="${(e.notes||"").replace(/"/g,'&quot;')}" data-capacity="${e.capacityKey||"default"}">
          <td data-col="time">${viewTime}</td>
          <td data-col="duration">${e.durationMin}</td>
          <td>${e.agentId}</td>
          <td data-col="customer">${e.customer||""}</td>
          <td data-col="notes">${e.notes||""}</td>
          <td>
            <button class="edit">Edit</button>
            <button class="delete" data-time="${e.time}">Delete</button>
          </td>
        </tr>`;
    }

    function attachRowHandlers() {
      document.querySelectorAll(".entry-row .edit").forEach(btn => {
        btn.addEventListener("click", (ev) => {
          const row = ev.target.closest(".entry-row");
          editForm.id.value = row.dataset.id;
          editForm.time.value = row.dataset.time;
          editForm.dataset.originalTime = row.dataset.time;
          editForm.durationMin.value = row.dataset.duration || 10;
          editForm.customer.value = row.dataset.customer || "";
          editForm.notes.value = row.dataset.notes || "";
          editForm.capacityKey.value = row.dataset.capacity || "default";
          showModal();
        });
      });

      document.querySelectorAll(".entry-row .delete").forEach(btn => {
        btn.addEventListener("click", async (ev) => {
          const row = ev.target.closest(".entry-row");
          const id = row.dataset.id;
          const time = ev.target.getAttribute("data-time"); // original UTC HH:mm
          const date = dayEl.value;
          if (!confirm("Delete this entry?")) return;
          try {
            await Api.deleteEntry(id, date, time);
            row.remove();
            if (!tbody.children.length) tbody.innerHTML = `<tr><td colspan="6">No entries.</td></tr>`;
          } catch (e) {
            alert("Delete failed: " + e.message);
          }
        });
      });
    }


    // Edit modal submit
    editCancel.addEventListener("click", hideModal);
    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(editForm);
      const id = fd.get("id");
      const newTime = fd.get("time");
      const priorTime = editForm.dataset.originalTime || newTime;
      const date = dayEl.value;
      if (!ensure10m(newTime)) return alert("Time must be 10-minute aligned.");

      const patch = {
        currentDate: date,
        currentTime: priorTime,
        date,
        time: newTime,
        durationMin: Number(fd.get("durationMin")),
        customer: fd.get("customer") || "",
        notes: fd.get("notes") || "",
        capacityKey: fd.get("capacityKey") || "default"
      };

      try {
        await Api.updateEntry(id, patch);
        hideModal();
        await loadDay();
      } catch (err) {
        alert("Update failed: " + err.message);
      }
    });

    refreshBtn.addEventListener("click", loadDay);
    dayEl.addEventListener("change", loadDay);
    loadDay();
  })();
  </script>
