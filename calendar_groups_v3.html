<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PoC – Scheduler (Calendar + Groups)</title>

  <!-- Styles: lightweight and scoped -->
  <style>
    :root {
      --bg:#f7f7f9; --card:#fff; --ink:#1a1d2a; --muted:#6a7280; --line:#e6e8ef; --brand:#0d6efd;
      --ok:#18a558; --warn:#a87b00; --full:#d93025; --slot-h:32px;
    }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
    .wrap { max-width:1180px; margin:0 auto; padding:18px; display:grid; gap:12px; }

    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .toolbar label { font-size:14px; color:var(--muted); }
    .toolbar select, .toolbar input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; }

    .day-tabs { display:flex; flex-wrap:wrap; gap:8px; }
    .day-tab { background:var(--card); border:1px solid var(--line); padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); }
    .day-tab.active { color:var(--ink); border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset; }

    /* Calendar frame with left hour labels and scrollable slots */
    .calendar { background:var(--card); border:1px solid var(--line); border-radius:10px; display:grid; grid-template-columns:90px 1fr; overflow:hidden; height:620px; }
    .time-labels { border-right:1px solid var(--line); overflow-y:auto; background:#fafbff; }
    .slots { overflow-y:auto; }
    .hour-label { height:calc(var(--slot-h)*6); display:grid; align-items:start; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }

    /* Each 10-minute row */
    .slot { height:var(--slot-h); display:grid; align-items:center; border-bottom:1px solid var(--line);
            grid-template-columns: 90px 110px 1fr; gap:8px; padding:0 8px; }
    .slot:hover { background:#f7faff; }
    .slot-time { font-size:12px; color:var(--ink); }
    .slot-cap { font-size:12px; padding:2px 8px; border-radius:999px; width:max-content; }
    .cap-ok   { background:rgba(24,165,88,.12); color:var(--ok);   border:1px solid rgba(24,165,88,.35); }
    .cap-warn { background:rgba(230,184,0,.12); color:var(--warn); border:1px solid rgba(230,184,0,.35); }
    .cap-full { background:rgba(217,48,37,.12); color:var(--full); border:1px solid rgba(217,48,37,.35); }

    .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .chip { font-size:11px; background:#f2f4ff; border:1px solid var(--line); padding:2px 6px; border-radius:6px; }
    .status { font-size:12px; color:var(--muted); padding:4px 2px 0; }

    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
    thead tr { background:#f6f7ff; }

    .btn { padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#f2f4ff; cursor:pointer; }
    .btn.brand { background:var(--brand); color:#fff; border:none; }
  </style>

  <!-- API client -->
  <script>
    (function () {
      const BASE = "https://f36ru2h4ua.execute-api.us-east-1.amazonaws.com/prod";
      async function fetchJSON(url, options = {}) {
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        const res = await fetch(url, { ...options, headers });
        const txt = await res.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch {}
        if (!res.ok) throw new Error(data?.error || data?.message || res.statusText);
        return data;
      }
      function qs(obj){ const p=new URLSearchParams(); Object.entries(obj).forEach(([k,v])=> (v!=null && v!=="") && p.append(k,v)); return p.toString(); }
      window.Api = {
        listEntries: (date)                 => fetchJSON(`${BASE}/entries?${qs({date})}`),
        createEntry: (entry)                => fetchJSON(`${BASE}/entries`, { method:"POST", body:JSON.stringify(entry) }),
        deleteEntry: (id, date, time)       => fetchJSON(`${BASE}/entries/${id}?${qs({date,time})}`, { method:"DELETE" }),
      };
    })();
  </script>

  <!-- Time zone + UTC helpers -->
  <script>
    const pad = n => String(n).padStart(2,'0');
    const TZ_KEY = "ui.timezone";
    const DEFAULT_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const TZ_LIST = ["UTC","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","Europe/London","Europe/Berlin","Asia/Tokyo","Australia/Sydney"];
    function getSelectedTZ(){ return localStorage.getItem(TZ_KEY) || DEFAULT_TZ; }
    function setSelectedTZ(tz){ localStorage.setItem(TZ_KEY, tz); }
    function initTZDropdown(sel){
      sel.innerHTML=""; const chosen = getSelectedTZ();
      TZ_LIST.forEach(tz=>{ const o=document.createElement('option'); o.value=tz; o.textContent=tz; if(tz===chosen) o.selected=true; sel.appendChild(o); });
      sel.addEventListener('change', ()=> setSelectedTZ(sel.value));
    }
    function formatUTCAsLocal(iso, opts={}) {
      return new Intl.DateTimeFormat(undefined, { timeZone:getSelectedTZ(), hour:"2-digit", minute:"2-digit", ...opts }).format(new Date(iso));
    }
    function toUTCISOFromSelectedTZ(dateYYYYMMDD, hhmm) {
      const tz = getSelectedTZ();
      const localWall = new Date(`${dateYYYYMMDD}T${hhmm}:00`);
      const inv = new Date(localWall.toLocaleString('en-US', { timeZone: tz }));
      const diff = localWall.getTime() - inv.getTime();
      return new Date(localWall.getTime() + diff).toISOString();
    }
  </script>
</head>

<body>
  <div class="wrap">
    <!-- Top toolbar: Day, Group, Time zone -->
    <div class="toolbar">
      <label>Day: <input id="day" type="date"/></label>
      <label>Group: <select id="group"></select></label>
      <label>Time zone: <select id="tzSelect"></select></label>
      <button id="refresh" class="btn">Refresh</button>
    </div>

    <!-- Tabs (Today + next 4) -->
    <div class="day-tabs" id="dayTabs"></div>

    <!-- Calendar (hour labels left, 10-min rows right) -->
    <div class="calendar">
      <div class="time-labels" id="timeLabels"></div>
      <div class="slots" id="slots"></div>
    </div>

    <div class="status" id="status">Ready.</div>

    <!-- Create entry -->
    <div class="toolbar">
      <form id="createForm" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center" novalidate>
        <label>Time <input name="time" type="time" step="600" required/></label>
        <label>Duration (min) <input name="durationMin" type="number" min="10" step="10" value="10" required/></label>
        <label>Agent ID <input name="agentId" required/></label>
        <label>Customer <input name="customer"/></label>
        <label>Notes <input name="notes"/></label>
        <button id="createBtn" class="btn brand" type="submit">Create</button>
      </form>
    </div>

    <!-- Entries table -->
    <div style="background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto;">
      <table id="entriesTable">
        <thead><tr><th>Time</th><th>Duration</th><th>Agent</th><th>Customer</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody id="entriesTbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ---------- state ----------
    const DAYS = 5;                                     // today + 4
    const LS_GROUP = 'sc_group_key';                    // sticky group
    let groupCfg = null;                                 // parsed capacity.json
    let activeGroupKey = null;
    let activeDateISO = null;                            // YYYY-MM-DD
    let dayItems = [];                                   // entries from API for active day

    // ---------- helpers ----------
    function setStatus(msg){ document.getElementById('status').textContent = msg; }
    function times10(){ const out=[]; for(let h=0;h<24;h++) for(let m=0;m<60;m+=10) out.push(`${pad(h)}:${pad(m)}`); return out; }

    // capacity for selected group and HH:MM (capacity.json is per-slot, per-group; date-agnostic)
    function capacityForHHMM(hhmm) {
      const slots = groupCfg?.groups?.[activeGroupKey]?.slots || {};
      const v = slots[hhmm];
      return typeof v === 'number' ? v : 0;             // missing means closed
    }

    // count booked items for HH:MM in the loaded dayItems
    function bookedCount(hhmm) {
      return dayItems.filter(e => e.time === hhmm).length; // API uses UTC HH:MM; we're showing TZ-local labels separately
    }

    // ---------- UI: Day tabs ----------
    function renderTabs(){
      const tabs = document.getElementById('dayTabs'); tabs.innerHTML='';
      const today = new Date(); today.setHours(0,0,0,0);
      for(let i=0;i<DAYS;i++){
        const d = new Date(today); d.setDate(today.getDate()+i);
        const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        const btn = document.createElement('button');
        btn.className = 'day-tab' + (iso===activeDateISO ? ' active' : '');
        btn.textContent = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }) + (i===0 ? ' (Today)' : '');
        btn.onclick = async ()=>{ activeDateISO = iso; renderTabs(); await refreshDay(); };
        tabs.appendChild(btn);
      }
    }

    // ---------- UI: hour labels (left column) ----------
    function renderHourLabels(){
      const host = document.getElementById('timeLabels'); host.innerHTML='';
      for(let h=0; h<24; h++){
        const label = formatUTCAsLocal(`${activeDateISO}T${pad(h)}:00:00Z`, { hour:"2-digit" });
        const div = document.createElement('div'); div.className='hour-label'; div.textContent = `${label}:00`;
        host.appendChild(div);
      }
    }

    // ---------- UI: slot rows (right column) ----------
    function capClass(used, cap){ if(cap===0 || used>=cap) return 'cap-full'; if(used>=cap-1) return 'cap-warn'; return 'cap-ok'; }
    function renderSlots(scrollToNow=false){
      renderHourLabels();                                 // keep left labels in sync
      const host = document.getElementById('slots'); host.innerHTML='';
      times10().forEach(hhmm=>{
        const used = bookedCount(hhmm);
        const cap  = capacityForHHMM(hhmm);

        const row = document.createElement('div'); row.className='slot'; row.dataset.time = hhmm;

        // Time column (display local TZ label)
        const tcol = document.createElement('div'); tcol.className='slot-time';
        const localLabel = formatUTCAsLocal(`${activeDateISO}T${hhmm}:00Z`, { hour:"2-digit", minute:"2-digit" });
        tcol.textContent = localLabel;

        // Capacity badge
        const capCol = document.createElement('div');
        capCol.className = `slot-cap ${capClass(used, cap)}`;
        capCol.textContent = `${used}/${cap}`;

        // Chips (names) – simple list for now
        const chips = document.createElement('div'); chips.className='chips';
        dayItems.filter(e=>e.time===hhmm).forEach(e=>{
          const sp = document.createElement('span'); sp.className='chip'; sp.textContent = `${e.customer||''} · ${e.agentId||''}`;
          chips.appendChild(sp);
        });

        // Double-click row to prefill form
        row.ondblclick = ()=>{
          if(cap<=0 || used>=cap){ alert('This timeslot is full or closed.'); return; }
          const timeInput = document.querySelector('#createForm input[name="time"]'); if(timeInput) timeInput.value = hhmm;
        };

        row.appendChild(tcol); row.appendChild(capCol); row.appendChild(chips);
        host.appendChild(row);
      });

      if(scrollToNow){
        const now = new Date();
        if(`${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())}` === activeDateISO){
          const idx = now.getUTCHours()*6 + Math.floor(now.getUTCMinutes()/10);
          const el = host.children[idx]; if(el) host.scrollTo({ top: el.offsetTop-100, behavior:'smooth' });
        }
      }
    }

    // ---------- capacity.json + group dropdown ----------
    async function loadGroupsConfig(){
      const r = await fetch('capacity.json',{ cache:'no-store' });
      if(!r.ok) throw new Error('Failed to load capacity.json');
      groupCfg = await r.json();

      const sel = document.getElementById('group'); sel.innerHTML='';
      Object.entries(groupCfg.groups).forEach(([key,g])=>{
        const opt=document.createElement('option'); opt.value=key; opt.textContent=g.displayName||key; sel.appendChild(opt);
      });
      const saved = localStorage.getItem(LS_GROUP);
      activeGroupKey = (saved && groupCfg.groups[saved]) ? saved : sel.value;
      sel.value = activeGroupKey;
      sel.addEventListener('change', ()=>{ activeGroupKey = sel.value; localStorage.setItem(LS_GROUP, activeGroupKey); renderSlots(); });
    }

    // ---------- API: load entries for active day ----------
    async function refreshDay(){
      setStatus('Loading entries…');
      try {
        dayItems = await Api.listEntries(activeDateISO);
        // Sort by time (UTC HH:MM)
        dayItems.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      } catch(e){ dayItems=[]; console.error(e); }
      renderSlots(true);
      renderEntriesTable();
      setStatus(`Loaded ${dayItems.length} entries.`);
    }

    // ---------- entries table ----------
    function renderEntriesTable(){
      const tb = document.getElementById('entriesTbody'); tb.innerHTML='';
      if(!dayItems.length){ tb.innerHTML = `<tr><td colspan="6" class="muted">No entries.</td></tr>`; return; }
      tb.innerHTML = dayItems.map(e=>{
        const iso = e.scheduledAt ? e.scheduledAt : `${e.date}T${e.time}:00Z`;
        const view = formatUTCAsLocal(iso, { hour:"2-digit", minute:"2-digit" });
        return `<tr data-id="${e.id}" data-time="${e.time}">
          <td>${view}</td><td>${e.durationMin||''}</td><td>${e.agentId||''}</td>
          <td>${e.customer||''}</td><td>${e.notes||''}</td>
          <td><button class="btn" data-act="del">Delete</button></td>
        </tr>`;
      }).join('');
      tb.querySelectorAll('button[data-act="del"]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const tr = btn.closest('tr'); const id = tr.dataset.id; const time = tr.dataset.time;
          if(!confirm('Delete this entry?')) return;
          try { await Api.deleteEntry(id, activeDateISO, time); tr.remove(); setStatus('Deleted.'); await refreshDay(); }
          catch(e){ alert('Delete failed: ' + e.message); }
        });
      });
    }

    // ---------- create form (local TZ → UTC, include groupKey) ----------
    (function wireCreate(){
      const form = document.getElementById('createForm');
      const btn  = document.getElementById('createBtn');
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        btn.disabled=true; btn.textContent='Creating…';
        try{
          const fd = new FormData(form);
          const time = fd.get('time');                               // HH:MM (local wall time)
          const iso  = toUTCISOFromSelectedTZ(activeDateISO, time);  // UTC instant
          const d = new Date(iso);
          const utcDate = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
          const utcTime = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;

          const payload = {
            date: utcDate, time: utcTime,
            durationMin: Number(fd.get('durationMin')||10),
            agentId: fd.get('agentId')||'',
            customer: fd.get('customer')||'',
            notes: fd.get('notes')||'',
            scheduledAt: iso,
            groupKey: activeGroupKey        // server derives queue from capacity.json
          };
          await Api.createEntry(payload);
          form.reset();
          await refreshDay();
          setStatus(`Created ${time} (${utcTime} UTC) for group “${groupCfg.groups[activeGroupKey].displayName}”.`);
        }catch(err){ alert('Create failed: ' + (err?.message||err)); }
        finally{ btn.disabled=false; btn.textContent='Create'; }
      });
    })();

    // ---------- init ----------
    (async function init(){
      // set day = today
      const t=new Date(); const day = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
      document.getElementById('day').value = day; activeDateISO = day;

      // tz dropdown
      initTZDropdown(document.getElementById('tzSelect'));
      document.getElementById('tzSelect').addEventListener('change', ()=>{ renderHourLabels(); renderSlots(); renderEntriesTable(); });

      // groups + capacity, then render
      await loadGroupsConfig();

      // tabs, data, calendar
      renderTabs();
      await refreshDay();

      // refresh button / day picker
      document.getElementById('refresh').addEventListener('click', refreshDay);
      document.getElementById('day').addEventListener('change', async ()=>{ activeDateISO = document.getElementById('day').value; renderTabs(); await refreshDay(); });
    })();
  </script>
</body>
</html>
