name: Deploy to S3 (scheduled-callback-ui)

on:
  push: {}
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ROLE_ARN: arn:aws:iam::758340002747:role/GitHubS3DeployRole-scheduled-callback
      S3_BUCKET: gene-scheduled-callback
      S3_PREFIX: scheduled-callback-ui/
      SOURCE_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Sync files to S3 prefix
        run: |
          aws s3 sync "$SOURCE_DIR" "s3://$S3_BUCKET/$S3_PREFIX" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore"
